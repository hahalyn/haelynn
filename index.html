<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자원 회수 공정 최적화 시뮬레이터</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Ver 18.2.0) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-types (Recharts 의존성) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>

    <!-- Recharts (Ver 2.12.7 - 안정 버전) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Babel (JSX 변환용) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
        }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        // window.Recharts에서 컴포넌트 추출
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, AreaChart, Area, ComposedChart } = window.Recharts;

        // 아이콘 컴포넌트
        const IconSettings = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6 text-indigo-600"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const IconActivity = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        );
        const IconAlertTriangle = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        );
        const IconTrendingUp = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        );
        const IconInfo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mt-0.5 text-gray-500"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );

        const ResourceRecoverySim = () => {
            const [targetRecovery, setTargetRecovery] = useState(85);
            const [techEfficiency, setTechEfficiency] = useState(1.5);
            
            const generateData = () => {
                const data = [];
                let maxScore = -Infinity;
                let optimalPoint = 0;

                for (let r = 0; r <= 98; r += 2) {
                    const recovery = r; 
                    const value = recovery * 10; 
                    const burden = techEfficiency * (Math.pow(1.05, r) - 1) * 2 + (r * 0.5);
                    const score = value - burden;

                    if (score > maxScore) {
                        maxScore = score;
                        optimalPoint = r;
                    }

                    data.push({
                        recovery,
                        value: parseFloat(value.toFixed(1)),
                        burden: parseFloat(burden.toFixed(1)),
                        score: parseFloat(score.toFixed(1)),
                    });
                }
                return { data, optimalPoint, maxScore };
            };

            const { data, optimalPoint, maxScore } = useMemo(() => generateData(), [techEfficiency]);
            const currentStat = data.find(d => d.recovery === targetRecovery) || { value: 0, burden: 0, score: 0 };
            
            const getStatusMessage = () => {
                if (targetRecovery > optimalPoint + 10) {
                    return { 
                        text: "비효율 구간: 회수율 향상에 따른 에너지 부하가 급격히 증가하여 종합 효율이 감소하고 있습니다. (트레이드 오프 발생)", 
                        color: "text-red-600",
                        bgColor: "bg-red-50",
                        borderColor: "border-red-200",
                        icon: <IconAlertTriangle />
                    };
                } else if (targetRecovery < optimalPoint - 10) {
                    return { 
                        text: "잠재력 구간: 에너지 여유가 있어 회수율을 더 높여 경제성을 확보할 수 있습니다.", 
                        color: "text-blue-600", 
                        bgColor: "bg-blue-50",
                        borderColor: "border-blue-200",
                        icon: <IconTrendingUp />
                    };
                } else {
                    return { 
                        text: "최적화 구간: 공정의 경제성과 환경부담이 최적의 균형을 이루고 있습니다.", 
                        color: "text-green-600", 
                        bgColor: "bg-green-50",
                        borderColor: "border-green-200",
                        icon: <IconActivity />
                    };
                }
            };

            const status = getStatusMessage();

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans">
                    <div className="max-w-6xl mx-auto space-y-6">
                        <header className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h1 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                        <IconSettings />
                                        자원 회수 공정 최적화 시뮬레이터
                                    </h1>
                                    <p className="text-slate-500 mt-1">
                                        학급 공동 시뮬레이션 탐구 랩 | 회수율-에너지 효율 민감도 분석
                                    </p>
                                </div>
                                <div className="bg-indigo-50 px-4 py-2 rounded-lg border border-indigo-100 text-sm text-indigo-700">
                                    현재 제안 지표: <strong>종합 공정 효율성 (OPI)</strong>
                                </div>
                            </div>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-1 space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-full">
                                    <h2 className="text-lg font-semibold mb-6 flex items-center text-slate-700">
                                        <span className="mr-2">🎛️</span> 변수 조절 (Control)
                                    </h2>
                                    <div className="mb-8">
                                        <div className="flex justify-between mb-2">
                                            <label className="font-medium text-slate-700">목표 회수율 (Target Recovery)</label>
                                            <span className="font-bold text-indigo-600">{targetRecovery}%</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max="98" 
                                            step="2"
                                            value={targetRecovery} 
                                            onChange={(e) => setTargetRecovery(Number(e.target.value))}
                                            className="w-full"
                                        />
                                        <p className="text-xs text-gray-500 mt-2">
                                            *높을수록 더 많은 자원을 회수하지만 공정 난이도가 상승함
                                        </p>
                                    </div>

                                    <div className="mb-8">
                                        <div className="flex justify-between mb-2">
                                            <label className="font-medium text-slate-700">재생 에너지 부하 계수</label>
                                            <span className="font-bold text-slate-600">{techEfficiency.toFixed(1)}</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="0.5" 
                                            max="3.0" 
                                            step="0.1"
                                            value={techEfficiency} 
                                            onChange={(e) => setTechEfficiency(Number(e.target.value))}
                                            className="w-full accent-slate-500"
                                        />
                                        <p className="text-xs text-gray-500 mt-2">
                                            *값이 클수록 재생 단계의 에너지 효율이 낮음 (구형 설비)
                                        </p>
                                    </div>

                                    <div className="border-t pt-6 mt-6">
                                        <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">현재 상태 분석</h3>
                                        <div className={`p-4 rounded-lg border flex items-start ${status.bgColor} ${status.borderColor}`}>
                                            <div className={`${status.color} mt-0.5`}>{status.icon}</div>
                                            <p className={`text-sm ${status.color} font-medium leading-relaxed`}>
                                                {status.text}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-2 space-y-6">
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                        <div className="text-sm text-gray-500 mb-1">순수 자원 회수량</div>
                                        <div className="text-2xl font-bold text-slate-800">{currentStat.value} <span className="text-sm font-normal text-gray-400">unit</span></div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                        <div className="text-sm text-gray-500 mb-1">재생 에너지 부하</div>
                                        <div className={`text-2xl font-bold ${currentStat.burden > currentStat.value ? 'text-red-500' : 'text-orange-500'}`}>
                                            {currentStat.burden} <span className="text-sm font-normal text-gray-400">kWh</span>
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 bg-indigo-50 border-indigo-100">
                                        <div className="text-sm text-indigo-600 mb-1 font-semibold">종합 최적화 지표</div>
                                        <div className="text-2xl font-bold text-indigo-700">{currentStat.score} <span className="text-sm font-normal">pts</span></div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="font-bold text-lg text-slate-800">민감도 분석 시뮬레이션 결과</h3>
                                        <div className="flex gap-4 text-xs">
                                            <span className="flex items-center"><div className="w-3 h-3 bg-blue-400 rounded-full mr-1"></div> 회수 가치</span>
                                            <span className="flex items-center"><div className="w-3 h-3 bg-red-400 rounded-full mr-1"></div> 에너지 부하</span>
                                            <span className="flex items-center"><div className="w-3 h-3 border-2 border-indigo-600 mr-1"></div> 종합 지표</span>
                                        </div>
                                    </div>

                                    <div className="h-[350px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <ComposedChart data={data} margin={{ top: 10, right: 30, left: 0, bottom: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                                <XAxis 
                                                    dataKey="recovery" 
                                                    label={{ value: '공정 회수율 (%)', position: 'insideBottom', offset: -10 }} 
                                                    tick={{fontSize: 12}}
                                                />
                                                <YAxis label={{ value: '가치 / 부하', angle: -90, position: 'insideLeft' }} />
                                                <Tooltip 
                                                    contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }}
                                                />
                                                
                                                <Area type="monotone" dataKey="value" fill="#93c5fd" stroke="#3b82f6" fillOpacity={0.1} strokeWidth={2} name="회수 가치" />
                                                <Line type="monotone" dataKey="burden" stroke="#ef4444" strokeWidth={3} dot={false} name="재생 에너지 부하" />
                                                <Line type="monotone" dataKey="score" stroke="#4f46e5" strokeWidth={3} dot={false} name="종합 효율 지표" />

                                                <ReferenceLine x={targetRecovery} stroke="black" strokeDasharray="3 3" label="현재 설정" />
                                                <ReferenceLine x={optimalPoint} stroke="green" strokeDasharray="3 3" label={{ position: 'top',  value: '최적점', fill: 'green', fontSize: 12 }} />
                                            
                                            </ComposedChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="mt-4 p-4 bg-gray-50 rounded-lg text-sm text-gray-600">
                                        <div className="flex items-start gap-2">
                                            <IconInfo />
                                            <p>
                                                <strong>그래프 해석:</strong> 회수율(X축) 증가 시 파란 영역(가치)은 일정하게 늘지만, 
                                                <span className="text-red-500 font-bold"> 빨간선(부하)</span>은 특정 구간 후 급상승합니다(비선형성). 
                                                따라서 <span className="text-indigo-600 font-bold">종합 지표(보라색)</span>가 최대인 지점이 진짜 최적점입니다.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ResourceRecoverySim />);
    </script>
</body>
</html>
